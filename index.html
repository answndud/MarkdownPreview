<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Preview - 마크다운 미리보기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Highlight.js for code syntax -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-theme-light">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-theme-dark" disabled>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-gfm-heading-id@3.2.0/lib/index.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-footnote@1.2.4/dist/index.umd.js"></script>
    <!-- KaTeX for LaTeX math (parsed before Markdown escapes are consumed) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
    <!-- Direct visual PDF export (does not open the browser print dialog) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        (() => {
            const savedTheme = localStorage.getItem('markdown-preview-theme');
            const theme = savedTheme === 'dark' || savedTheme === 'light'
                ? savedTheme
                : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.dataset.theme = theme;
            document.documentElement.style.colorScheme = theme;
            document.getElementById('hljs-theme-light').disabled = theme === 'dark';
            document.getElementById('hljs-theme-dark').disabled = theme !== 'dark';
        })();
    </script>
    <style>
        .math-block {
            margin: 1em 0;
            overflow-x: auto;
            overflow-y: hidden;
        }

        .math-block .katex-display {
            margin: 0.5em 0;
        }

        /* Light theme */
        :root {
            color-scheme: light;
            --bg-primary: #ffffff;
            --bg-secondary: #f6f8fa;
            --bg-card: #ffffff;
            --bg-editor: #ffffff;
            --accent-primary: #0969da;
            --accent-secondary: #0550ae;
            --text-primary: #24292f;
            --text-secondary: #57606a;
            --text-muted: #8c959f;
            --border-color: #d0d7de;
            --gradient-accent: linear-gradient(135deg, #0969da 0%, #0550ae 100%);
            --code-bg: #f6f8fa;
            --blockquote-border: #0969da;
            --link-color: #0969da;
            --table-border: #d0d7de;
            --table-alt-bg: #f6f8fa;
            --overlay-bg: rgba(246, 248, 250, 0.76);
            --shadow-color: rgba(27, 31, 36, 0.14);
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-card: #161b22;
            --bg-editor: #0d1117;
            --accent-primary: #58a6ff;
            --accent-secondary: #79c0ff;
            --text-primary: #f0f6fc;
            --text-secondary: #c9d1d9;
            --text-muted: #8b949e;
            --border-color: #30363d;
            --gradient-accent: linear-gradient(135deg, #58a6ff 0%, #1f6feb 100%);
            --code-bg: #161b22;
            --blockquote-border: #58a6ff;
            --link-color: #58a6ff;
            --table-border: #30363d;
            --table-alt-bg: #161b22;
            --overlay-bg: rgba(13, 17, 23, 0.78);
            --shadow-color: rgba(0, 0, 0, 0.42);
        }

        html {
            zoom: 0.9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            margin-bottom: 15px;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 400;
            color: var(--text-primary);
        }

        .header-left h1 {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            justify-content: center;
            padding: 10px 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 0;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.85rem;
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .action-btn .icon:empty {
            display: none;
        }

        .action-btn:hover {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        .action-btn.primary {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        .action-btn.primary:hover {
            background: var(--accent-secondary);
            border-color: var(--accent-secondary);
        }

        .theme-toggle .theme-icon {
            width: 1.1em;
            text-align: center;
            font-size: 1.05rem;
            line-height: 1;
        }

/* Editor Layout */
        .editor-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }

        .panel {
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 0;
            overflow: hidden;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .panel-title {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #editor-panel .panel-header { gap: 12px; }
        #editor-panel .panel-title { flex: 1; min-width: 0; }
        #editor-panel .panel-actions { flex-shrink: 0; }
        .document-name {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .panel-actions {
            display: flex;
            gap: 8px;
        }

        .panel-btn {
            padding: 6px 12px;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 0;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s ease;
        }

        .panel-btn:hover {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        .action-btn:focus-visible,
        .panel-btn:focus-visible,
        .font-size-btn:focus-visible {
            outline: 2px solid var(--accent-primary);
            outline-offset: 2px;
        }

        /* Editor */
        .editor {
            flex: 1;
            width: 100%;
            padding: 20px;
            background: var(--bg-editor);
            border: none;
            resize: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            line-height: 1.7;
            color: var(--text-primary);
            outline: none;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .editor::placeholder {
            color: var(--text-muted);
        }

        /* Preview */
        .preview {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            min-width: 0;
            overflow-wrap: anywhere;
            background: var(--bg-card);
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.87;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* GitHub Flavored Markdown Styles */
        .preview h1, .preview h2, .preview h3,
        .preview h4, .preview h5, .preview h6 {
            margin-top: 24px;
            margin-bottom: 16px;
            font-weight: 600;
            line-height: 1.25;
            color: var(--text-primary);
        }

        .preview h1 a, .preview h2 a, .preview h3 a,
        .preview h4 a, .preview h5 a, .preview h6 a {
            color: var(--link-color);
        }

        .preview h1 {
            font-family: inherit;
            font-size: 1.75em;
            padding-bottom: 0.3em;
            border-bottom: 1px solid var(--border-color);
        }

        .preview h2 {
            font-size: 1.3em;
            padding-bottom: 0.3em;
            border-bottom: 1px solid var(--border-color);
        }

        .preview h3 { font-size: 1.15em; }
        .preview h4 { font-size: 1em; }
        .preview h5 { font-size: 0.875em; }
        .preview h6 { font-size: 0.85em; color: var(--text-primary); }

        .preview p {
            margin: 0 0 1em;
            line-height: inherit;
        }

        .preview a {
            color: var(--link-color);
            text-decoration: none;
        }

        .preview a:hover {
            text-decoration: underline;
        }

        .preview strong {
            font-weight: 600;
        }

        .preview em {
            font-style: italic;
        }

        .preview del {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .preview ul, .preview ol {
            margin: 0 0 1em;
            padding-left: 1.5em;
        }

        .preview :is(ul, ol) :is(ul, ol) {
            margin-top: 0;
            margin-bottom: 0;
        }

        .preview li {
            margin-bottom: 0;
            line-height: inherit;
        }

        .preview li + li {
            margin-top: 0.25em;
        }

        /* Checkboxes */
        .preview input[type="checkbox"] {
            margin-right: 8px;
            vertical-align: middle;
            accent-color: var(--accent-primary);
        }

        .preview li.task-list-item {
            list-style: none;
            margin-left: -1.5em;
        }

        /* Blockquote */
        .preview blockquote {
            margin: 0 0 1em;
            padding: 0 1em;
            color: var(--text-secondary);
            border-left: 4px solid var(--blockquote-border);
        }

        .preview blockquote > :last-child {
            margin-bottom: 0;
        }

        .preview .markdown-alert {
            padding: 0.5em 1em;
            border-left-color: var(--link-color);
        }

        .preview .markdown-alert-title {
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--link-color);
        }

        .preview .markdown-alert > :first-child { margin-top: 0; }
        .preview .markdown-alert > :last-child { margin-bottom: 0; }

        .preview .markdown-alert.markdown-alert-warning,
        .preview .markdown-alert.markdown-alert-caution {
            border-left-color: #b7791f;
        }

        .preview .footnotes {
            margin-top: 24px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            font-size: 0.85em;
        }

        .preview .footnotes .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
            border: 0;
        }

        .preview .footnotes p { margin-bottom: 0.4em; }
        .preview sup { line-height: 0; }
        .preview :is(h1, h2, h3, h4, h5, h6) { scroll-margin-top: 16px; }

        /* Code */
        .preview code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85em;
            padding: 0.2em 0.4em;
            background: var(--code-bg);
            border-radius: 0;
            color: var(--text-primary);
        }

        .preview pre {
            margin: 0 0 1em;
            padding: 1em;
            font-size: 0.85em;
            line-height: 1.45;
            background: var(--code-bg);
            border-radius: 0;
            overflow-x: auto;
            border: 1px solid var(--border-color);
        }

        .preview pre code {
            padding: 0;
            background: transparent;
            font-size: 1em;
            line-height: inherit;
        }

        /* Table */
        .preview .table-scroll {
            max-width: 100%;
            overflow-x: auto;
            margin: 0 0 1em;
        }

        .preview table {
            width: max-content;
            max-width: 100%;
            overflow-wrap: normal;
            margin: 0;
            font-size: 1em;
            line-height: inherit;
            border-collapse: collapse;
            border-spacing: 0;
        }

        .preview th, .preview td {
            padding: 0.375em 0.8125em;
            border: 1px solid var(--table-border);
            text-align: left;
        }

        .preview :is(th, td)[align="center"] { text-align: center; }
        .preview :is(th, td)[align="right"] { text-align: right; }
        .preview th > :last-child, .preview td > :last-child { margin-bottom: 0; }

        .preview th {
            background: var(--bg-secondary);
            font-weight: 600;
        }

        .preview tr:nth-child(even) {
            background: var(--table-alt-bg);
        }

        /* Horizontal Rule */
        .preview hr {
            margin: 24px 0;
            height: 0.25em;
            border: 0;
            background: #e3e4e8;
        }
        :root[data-theme="dark"] .preview hr { background: #30363d; }

        /* Image */
        .preview img {
            max-width: 100%;
            height: auto;
            border-radius: 0;
            vertical-align: middle;
        }

        /* Drag & drop markdown import */
        .drop-overlay {
            position: fixed;
            inset: 0;
            z-index: 5000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--overlay-bg);
            backdrop-filter: blur(6px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        body.drag-over .drop-overlay {
            opacity: 1;
        }

        .drop-overlay-content {
            width: min(520px, 100%);
            padding: 42px 32px;
            border: 2px dashed var(--accent-primary);
            border-radius: 0;
            background: var(--bg-card);
            box-shadow: 0 20px 60px var(--shadow-color);
            text-align: center;
        }

        .drop-overlay-icon {
            display: block;
            margin-bottom: 14px;
            font-size: 2.7rem;
        }

        .drop-overlay-title {
            margin-bottom: 8px;
            color: var(--text-primary);
            font-size: 1.15rem;
            font-weight: 600;
        }

        .drop-overlay-description {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        /* Sample Templates */
        .templates-dropdown {
            position: relative;
        }

        .templates-menu {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 5px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 0;
            padding: 8px 0;
            min-width: 180px;
            box-shadow: 0 10px 40px var(--shadow-color);
            display: none;
            z-index: 100;
        }

        .templates-menu.show {
            display: block;
        }

        .template-item {
            padding: 10px 16px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-secondary);
            transition: all 0.2s ease;
        }

        .template-item:hover {
            background: var(--accent-primary);
            color: white;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-primary);
            color: white;
            padding: 12px 24px;
            border-radius: 0;
            font-size: 0.9rem;
            z-index: 9999;
            animation: slideUp 0.3s ease;
        }

        .toast.toast-top {
            top: 30px;
            bottom: auto;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        footer a {
            color: var(--link-color);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .editor-container {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
            }

            header {
                flex-wrap: wrap;
                gap: 10px;
            }

            .header-left {
                width: 100%;
            }

            .header-actions {
                width: 100%;
                justify-content: flex-end;
            }

            h1 {
                font-size: 1.2rem;
            }

            .action-btn span:not(.icon) {
                display: none;
            }

        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 0;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* Full screen mode */
        .panel.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1000;
            border-radius: 0;
        }

        /* Fullscreen preview - centered reading mode */
        #preview-panel.fullscreen {
            background: var(--bg-secondary);
            border-top: 0;
            display: flex;
            align-items: center;
            --preview-reading-width: 60%;
        }

        #preview-panel.fullscreen .panel-header {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 158px;
            max-height: calc(100% - 16px);
            overflow-y: auto;
            padding: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 0;
            box-shadow: none;
            z-index: 1;
        }
        #preview-panel.fullscreen .panel-header.toc-open {
            width: min(286px, calc(100% - 16px));
        }

        #preview-panel.fullscreen .panel-title {
            display: none;
        }

        #preview-panel.fullscreen .panel-actions {
            width: 100%;
            flex-direction: column;
            align-items: stretch;
            gap: 6px;
            min-width: 0;
            max-height: calc(100vh - 34px);
        }
        #preview-panel.fullscreen .panel-actions > :not(#preview-toc) {
            flex-shrink: 0;
        }

        #preview-panel.fullscreen .font-size-control {
            gap: 3px;
            justify-content: space-between;
            margin-right: 0;
            padding: 1px 3px 1px 5px;
        }
        #preview-settings:not([hidden]) {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        #preview-settings-toggle { justify-content: center; }

        .preview-scroll-btn { display: none; }
        #preview-panel.fullscreen .preview-scroll-btn {
            display: block;
            align-self: center;
            padding: 2px 6px;
        }

        .fullscreen-only { display: none; }
        #preview-panel.fullscreen .fullscreen-only { display: flex; }
        #preview-toc-toggle { justify-content: center; }
        #preview-toc {
            width: 100%;
            min-height: 0;
            overflow-y: auto;
        }
        #preview-toc[hidden] { display: none; }
        #preview-toc .toc-row {
            display: flex;
            align-items: flex-start;
            padding-left: calc((var(--heading-level) - 1) * 2px);
        }
        #preview-toc .toc-row[hidden] { display: none; }
        #preview-toc .toc-expand, #preview-toc .toc-spacer {
            flex: 0 0 9px;
            width: 9px;
            padding: 4px 0;
        }
        #preview-toc .toc-expand {
            border: 0;
            background: transparent;
            color: var(--text-primary);
            font-size: 0.6rem;
            cursor: pointer;
        }
        #preview-toc .toc-item {
            display: block;
            flex: 1;
            min-width: 0;
            padding: 4px 2px;
            border: 0;
            background: transparent;
            color: var(--text-primary);
            text-align: left;
            overflow-wrap: anywhere;
            cursor: pointer;
        }
        #preview-toc .toc-item:hover,
        #preview-toc .toc-item[aria-current="location"] { background: var(--code-bg); }

        .fullscreen-document-name { display: none; }
        #preview-panel.fullscreen .fullscreen-document-name {
            display: block;
            flex-shrink: 0;
            width: var(--preview-reading-width);
            padding: 12px 16px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-top: 0;
            color: var(--text-primary);
            font-size: 0.85rem;
            font-weight: 500;
        }

        #preview-panel.fullscreen .preview {
            --preview-line-height: 1.87;
            width: var(--preview-reading-width);
            max-width: none;
            min-height: 0;
            margin: 0 auto;
            padding: 28px 48px 48px;
            background: var(--bg-card);
            overflow-y: auto;
            box-sizing: border-box;
            align-self: center;
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 400;
            line-height: var(--preview-line-height);
        }

        /* Reading controls - hidden by default, shown in fullscreen */
        .font-size-control {
            display: none;
            align-items: center;
            gap: 5px;
            margin-right: 4px;
            padding: 4px 5px 4px 8px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 0;
            box-shadow: 0 1px 2px var(--shadow-color);
        }

        .panel.fullscreen .font-size-control {
            display: flex;
        }

        .font-size-btn {
            width: 28px;
            height: 28px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 0;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1rem;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .font-size-btn:hover {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        .font-size-value {
            font-size: 0.78rem;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
            min-width: 36px;
            padding: 4px 3px;
            text-align: center;
        }

        .reading-control-label {
            min-width: 28px;
            padding-right: 5px;
            border-right: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 0.75rem;
            font-weight: 600;
            text-align: center;
        }

        /* Code block copy button */
        .preview pre {
            position: relative;
        }

        .code-copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 4px 10px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 0;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.72rem;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.2s ease;
            opacity: 0;
            z-index: 1;
            line-height: 1.4;
        }

        .preview pre:hover .code-copy-btn {
            opacity: 1;
        }

        .code-copy-btn:hover {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        /* Mobile fullscreen fix */
        @media (max-width: 768px) {
            #preview-panel.fullscreen .fullscreen-document-name { width: 100%; }
            #preview-panel.fullscreen .preview,
            #editor-panel.fullscreen .editor {
                width: 100%;
                max-width: none;
                padding: 28px 22px;
                margin-top: 0;
            }

            #preview-panel.fullscreen .panel-actions {
                gap: 6px;
            }

            #preview-panel.fullscreen .font-size-btn {
                width: 26px;
                height: 26px;
            }

            #preview-panel.fullscreen .font-size-value {
                min-width: 34px;
            }
        }
        /* Keep the export capture free of controls that are only useful on screen. */
        .pdf-export-clone {
            position: absolute;
            left: -100000px;
            top: 0;
            pointer-events: none;
            z-index: -1;
        }

        /* Browser-like colors and controls, retaining the editor layout and both themes. */
        :root {
            --bg-primary: white;
            --bg-secondary: white;
            --bg-card: white;
            --bg-editor: white;
            --text-primary: black;
            --text-secondary: black;
            --text-muted: #555;
            --border-color: #888;
            --accent-primary: #555;
            --accent-secondary: #333;
            --code-bg: #f3f3f3;
            --blockquote-border: #888;
            --link-color: #0000ee;
            --table-border: #888;
            --table-alt-bg: white;
            --overlay-bg: rgba(255, 255, 255, 0.8);
            --shadow-color: transparent;
        }
        :root[data-theme="dark"] {
            --bg-primary: #161616;
            --bg-secondary: #161616;
            --bg-card: #161616;
            --bg-editor: #161616;
            --text-primary: #eee;
            --text-secondary: #eee;
            --text-muted: #bbb;
            --border-color: #888;
            --accent-primary: #bbb;
            --accent-secondary: #eee;
            --code-bg: #262626;
            --blockquote-border: #888;
            --link-color: #9bbcff;
            --table-border: #888;
            --table-alt-bg: #161616;
            --overlay-bg: rgba(22, 22, 22, 0.8);
            --shadow-color: transparent;
        }
        .action-btn, .action-btn:hover, .action-btn.primary, .action-btn.primary:hover,
        .panel-btn, .panel-btn:hover, .font-size-btn, .font-size-btn:hover,
        .code-copy-btn, .code-copy-btn:hover {
            appearance: auto;
            background: revert;
            color: revert;
            border: revert;
            box-shadow: none;
        }
        .action-btn, .panel-btn, .font-size-btn, .code-copy-btn {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 0.85rem;
            font-weight: 400;
            line-height: 1.25;
        }
        .action-btn { padding: 5px 9px; gap: 5px; }
        .panel-btn { padding: 4px 8px; }
        .font-size-btn { width: 26px; height: 26px; padding: 0; font-size: 1rem; }
        .code-copy-btn { padding: 3px 7px; font-size: 0.75rem; }
        /* Keep the reading surface distinct from the surrounding area. */
        #preview-panel.fullscreen { background: #eee; }
        :root[data-theme="dark"] #preview-panel.fullscreen { background: #303030; }
        #preview-panel.fullscreen .preview {
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
        }
        @media (max-width: 768px) {
            #preview-panel.fullscreen .preview { width: 100%; }
        }
        .font-size-control, .templates-menu, .drop-overlay-content { box-shadow: none; }
        .drop-overlay { backdrop-filter: none; }
        .template-item:hover { background: var(--code-bg); color: var(--text-primary); }
        .toast { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-color); }
        .preview a, footer a { text-decoration: underline; }
        .preview input[type="checkbox"] { accent-color: auto; }
        .action-btn:focus-visible, .panel-btn:focus-visible, .font-size-btn:focus-visible,
        .editor:focus-visible, .code-copy-btn:focus-visible { outline: auto; outline-offset: 2px; }
    </style>
</head>

                <textarea class="editor" id="editor" placeholder="마크다운을 입력하세요...

# 제목
**굵게**, *기울임*, ~~취소선~~

    <div class="drop-overlay" id="drop-overlay" aria-hidden="true">
        <div class="drop-overlay-content">
            <span class="drop-overlay-icon"></span>
            <div class="drop-overlay-title">Markdown 파일을 놓으면 바로 열립니다</div>
            <div class="drop-overlay-description">.md, .markdown 파일을 읽어 에디터와 미리보기에 즉시 반영합니다.</div>

    <script>
        function renderMath(token) {
            return katex.renderToString(token.text, {
                displayMode: token.displayMode,
                throwOnError: false,
                trust: false
            });
        }

        // Tokenize math before Markdown can consume LaTeX backslashes or underscores.
        // Code spans and fenced blocks keep Marked's normal literal rendering.
        const mathExtensions = [
            {
                name: 'blockMath',
                level: 'block',
                start(src) { return src.search(/(?:^|\n) {0,3}(?:\$\$|\\\[)/); },
                tokenizer(src) {
                    const match = /^(?: {0,3}\$\$([\s\S]+?)\$\$| {0,3}\\\[([\s\S]+?)\\\])[ \t]*(?:\n|$)/.exec(src);
                    if (match) {
                        return { type: 'blockMath', raw: match[0], text: (match[1] ?? match[2]).trim(), displayMode: true };
                    }
                },
                renderer(token) { return `<div class="math-block">${renderMath(token)}</div>\n`; }
            },
            {
                name: 'inlineMath',
                level: 'inline',
                start(src) { return src.search(/\$|\\\(/); },
                tokenizer(src) {
                    const match = /^(?:\$\$([^\n]+?)\$\$|\$(?!\$)(\S(?:[^$\n]*?\S)?)\$(?!\d)|\\\(([^\n]+?)\\\))/.exec(src);
                    if (match) {
                        return { type: 'inlineMath', raw: match[0], text: match[1] ?? match[2] ?? match[3], displayMode: match[1] !== undefined };
                    }
                },
                renderer: renderMath
            }
        ];

        // Configure Marked.js for GFM (v12 API)
        marked.use({
            gfm: true,
            breaks: true,
            extensions: mathExtensions
        });

        marked.use(markedGfmHeadingId.gfmHeadingId(), markedFootnote());

        // Editor & Preview
        const html = document.documentElement;
        const editor = document.getElementById('editor');
        const documentName = document.getElementById('document-name');
        function setDocumentName(name) {
            const label = name || '제목 없는 문서';
            documentName.textContent = label;
            documentName.title = label;
            const fullscreenDocumentName = document.getElementById('fullscreen-document-name');
            fullscreenDocumentName.textContent = label;
            fullscreenDocumentName.title = label;
            if (name) localStorage.setItem('markdown-filename', name);
            else localStorage.removeItem('markdown-filename');
        }
        const preview = document.getElementById('preview');
        const toc = document.getElementById('preview-toc');
        const tocList = document.getElementById('preview-toc-list');
        const tocToggle = document.getElementById('preview-toc-toggle');
        const collapsedTocItems = new Set();
        let tocEntries = [];

        function updateTocVisibility() {
            tocEntries.forEach(entry => {
                let ancestor = entry.parent;
                let hidden = false;
                while (ancestor) {
                    if (collapsedTocItems.has(ancestor.key)) { hidden = true; break; }
                    ancestor = ancestor.parent;
                }
                entry.row.hidden = hidden;
                if (entry.expand) {
                    const expanded = !collapsedTocItems.has(entry.key);
                    entry.expand.textContent = expanded ? '▾' : '▸';
                    entry.expand.setAttribute('aria-expanded', String(expanded));
                    entry.expand.setAttribute('aria-label', `${entry.title} 하위 목차 ${expanded ? '접기' : '펼치기'}`);
                }
            });
        }

        function closeToc() {
            toc.hidden = true;
            tocToggle.closest('.panel-header').classList.remove('toc-open');
            tocToggle.setAttribute('aria-expanded', 'false');
        }

        function updateCurrentTocItem() {
            if (toc.hidden) return;
            const headings = Array.from(preview.querySelectorAll('h1, h2, h3, h4, h5, h6'));
            const buttons = tocList.querySelectorAll('.toc-item');
            const previewRect = preview.getBoundingClientRect();
            const marker = previewRect.top + previewRect.height / 2;
            let current = -1;
            headings.forEach((heading, index) => {
                if (heading.getBoundingClientRect().top <= marker) current = index;
            });
            if (current === -1 && headings.length &&
                headings[0].getBoundingClientRect().top < preview.getBoundingClientRect().bottom) current = 0;
            let visibleEntry = tocEntries[current];
            while (visibleEntry && visibleEntry.row.hidden) visibleEntry = visibleEntry.parent;
            buttons.forEach(button => {
                if (visibleEntry && button === visibleEntry.button) button.setAttribute('aria-current', 'location');
                else button.removeAttribute('aria-current');
            });
            const active = visibleEntry?.button;
            if (active) {
                const itemRect = active.getBoundingClientRect();
                const tocRect = toc.getBoundingClientRect();
                if (itemRect.top < tocRect.top) toc.scrollTop -= tocRect.top - itemRect.top;
                else if (itemRect.bottom > tocRect.bottom) toc.scrollTop += itemRect.bottom - tocRect.bottom;
            }
        }

        function buildToc() {
            tocList.replaceChildren();
            tocEntries = [];
            const headings = Array.from(preview.querySelectorAll('h1, h2, h3, h4, h5, h6'));
            if (!headings.length) {
                tocList.textContent = '제목이 없습니다.';
                return;
            }
            const ancestors = [];
            headings.forEach((heading, index) => {
                const level = Number(heading.tagName.slice(1));
                while (ancestors.length && ancestors[ancestors.length - 1].level >= level) ancestors.pop();
                const title = heading.textContent.trim() || '(제목 없음)';
                const row = document.createElement('div');
                row.className = 'toc-row';
                row.style.setProperty('--heading-level', level);
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'toc-item';
                button.textContent = title;
                button.addEventListener('click', () => {
                    const previewRect = preview.getBoundingClientRect();
                    const headingRect = heading.getBoundingClientRect();
                    const scale = preview.offsetWidth ? previewRect.width / preview.offsetWidth : 1;
                    const nextHeading = headings.slice(index + 1).find(next => Number(next.tagName.slice(1)) <= level);
                    const lastContent = preview.lastElementChild;
                    const sectionEnd = nextHeading ? nextHeading.getBoundingClientRect().top :
                        (lastContent ? lastContent.getBoundingClientRect().bottom : headingRect.bottom);
                    const sectionMiddle = (headingRect.top + Math.max(headingRect.bottom, sectionEnd)) / 2;
                    const distance = sectionMiddle - (previewRect.top + previewRect.height / 2);
                    preview.scrollTop += distance / (scale || 1);
                    updateCurrentTocItem();
                });
                const entry = { level, title, key: `${index}:${level}:${title}`, parent: ancestors[ancestors.length - 1], row, button };
                if (headings[index + 1] && Number(headings[index + 1].tagName.slice(1)) > level) {
                    const expand = document.createElement('button');
                    expand.type = 'button';
                    expand.className = 'toc-expand';
                    expand.addEventListener('click', () => {
                        if (collapsedTocItems.has(entry.key)) collapsedTocItems.delete(entry.key);
                        else collapsedTocItems.add(entry.key);
                        updateTocVisibility();
                        updateCurrentTocItem();
                    });
                    entry.expand = expand;
                    row.appendChild(expand);
                } else {
                    const spacer = document.createElement('span');
                    spacer.className = 'toc-spacer';
                    spacer.setAttribute('aria-hidden', 'true');
                    row.appendChild(spacer);
                }
                row.appendChild(button);
                tocList.appendChild(row);
                tocEntries.push(entry);
                ancestors.push(entry);
            });
            updateTocVisibility();
        }

        tocToggle.addEventListener('click', () => {
            if (!toc.hidden) return closeToc();
            buildToc();
            toc.hidden = false;
            tocToggle.closest('.panel-header').classList.add('toc-open');
            tocToggle.setAttribute('aria-expanded', 'true');
            updateCurrentTocItem();
        });
        preview.addEventListener('scroll', updateCurrentTocItem);

        // Match scroll progress in both panes without feeding programmatic scrolls back.
        const pendingScrollPositions = new WeakMap();
        function syncScroll(source, target) {
            const pending = pendingScrollPositions.get(source);
            pendingScrollPositions.delete(source);
            if (pending !== undefined && Math.abs(source.scrollTop - pending) < 1) return;
            if (document.getElementById('preview-panel').classList.contains('fullscreen')) return;

            const sourceRange = source.scrollHeight - source.clientHeight;
            const targetRange = Math.max(0, target.scrollHeight - target.clientHeight);
            if (sourceRange <= 0) return;
            const next = Math.max(0, Math.min(1, source.scrollTop / sourceRange)) * targetRange;
            if (Math.abs(target.scrollTop - next) < 1) return;
            target.scrollTop = next;
            pendingScrollPositions.set(target, target.scrollTop);
        }
        editor.addEventListener('scroll', () => syncScroll(editor, preview));
        preview.addEventListener('scroll', () => syncScroll(preview, editor));
        const dropOverlay = document.getElementById('drop-overlay');

        function updatePreview() {
            const markdown = editor.value;
            preview.innerHTML = marked.parse(markdown);
            if (!toc.hidden) {
                buildToc();
                updateCurrentTocItem();
            }

            preview.querySelectorAll('table').forEach(table => {
                const wrapper = document.createElement('div');
                wrapper.className = 'table-scroll';
                wrapper.tabIndex = 0;
                wrapper.setAttribute('role', 'region');
                wrapper.setAttribute('aria-label', '표 (가로 스크롤 가능)');
                table.before(wrapper);
                wrapper.appendChild(table);
            });

            // GitHub alerts are a blockquote whose first line is an alert marker.
            preview.querySelectorAll('blockquote').forEach(quote => {
                const paragraph = quote.firstElementChild;
                const first = paragraph?.firstChild;
                if (paragraph?.tagName !== 'P' || first?.nodeType !== Node.TEXT_NODE) return;
                const match = /^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\](?:\n|$)/.exec(first.textContent);
                if (!match) return;
                first.textContent = first.textContent.slice(match[0].length);
                if (!first.textContent) {
                    first.remove();
                    if (paragraph.firstChild?.nodeName === 'BR') paragraph.firstChild.remove();
                }
                if (!paragraph.hasChildNodes()) paragraph.remove();
                quote.classList.add('markdown-alert', `markdown-alert-${match[1].toLowerCase()}`);
                const title = document.createElement('p');
                title.className = 'markdown-alert-title';
                title.textContent = match[1][0] + match[1].slice(1).toLowerCase();
                quote.prepend(title);
            });

            // Re-highlight code blocks + add copy buttons
            preview.querySelectorAll('pre code').forEach(block => {
                hljs.highlightElement(block);
            });

            // Task list item class (marked v12 doesn't add it automatically)
            preview.querySelectorAll('li input[type="checkbox"]').forEach(checkbox => {
                checkbox.closest('li').classList.add('task-list-item');
            });
            preview.querySelectorAll('pre').forEach(pre => {
                if (pre.querySelector('.code-copy-btn')) return;
                const btn = document.createElement('button');
                btn.className = 'code-copy-btn';
                btn.textContent = '복사';
                btn.addEventListener('click', () => {
                    const code = pre.querySelector('code');
                    navigator.clipboard.writeText(code ? code.textContent : pre.textContent).then(() => {
                        btn.textContent = ' 복사됨';
                        setTimeout(() => { btn.textContent = '복사'; }, 1500);
                    });
                });
                pre.appendChild(btn);
            });

            // Save to localStorage
            localStorage.setItem('markdown-content', markdown);
        }

        editor.addEventListener('input', updatePreview);

        // Drag & drop Markdown import
        let dragDepth = 0;
        const markdownFilePattern = /\.(md|markdown|mdown|mkdn)$/i;

        function isFileDrag(e) {
            return e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files');
        }

        function isMarkdownFile(file) {
            return markdownFilePattern.test(file.name) || file.type === 'text/markdown';
        }

        function showDropOverlay() {
            document.body.classList.add('drag-over');
            dropOverlay.setAttribute('aria-hidden', 'false');
        }

        function hideDropOverlay() {
            document.body.classList.remove('drag-over');
            dropOverlay.setAttribute('aria-hidden', 'true');
        }

        function readMarkdownFile(file) {

                applyPreviewFontSize(previewFontSize);
                applyPreviewWidth(previewWidth);
                applyPreviewLineHeight(previewLineHeight);
                resetEditorAndPreviewScroll();
            }
        });

        // ESC to exit fullscreen
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.panel.fullscreen').forEach(panel => {
                    exitFullscreen(panel);
                });
            }
        });

        // Font size controls
        const FONT_MIN = 13;
        const FONT_MAX = 28;
        const FONT_STEP = 1;

        let previewFontSize = parseInt(localStorage.getItem('preview-font-size')) || 18;

        // Update display values on load
        document.getElementById('preview-font-value').textContent = previewFontSize + 'px';

        function applyPreviewFontSize(size) {
            previewFontSize = Math.min(FONT_MAX, Math.max(FONT_MIN, size));
            document.getElementById('preview').style.fontSize = previewFontSize + 'px';
            document.getElementById('preview-font-value').textContent = previewFontSize + 'px';
            localStorage.setItem('preview-font-size', previewFontSize);
        }

        document.getElementById('preview-font-up').addEventListener('click', () => {
            applyPreviewFontSize(previewFontSize + FONT_STEP);
        });
        document.getElementById('preview-font-down').addEventListener('click', () => {
            applyPreviewFontSize(previewFontSize - FONT_STEP);
        });

        // Reading width controls
        const WIDTH_MIN = 35;
        const WIDTH_MAX = 95;
        const WIDTH_STEP = 5;

        const DEFAULT_PREVIEW_WIDTH = 60;
        let previewWidth = parseInt(localStorage.getItem('preview-reading-width-percent')) || DEFAULT_PREVIEW_WIDTH;

        document.getElementById('preview-width-value').textContent = previewWidth + '%';

        function applyPreviewWidth(width) {
            previewWidth = Math.min(WIDTH_MAX, Math.max(WIDTH_MIN, width));
            document.getElementById('preview-panel').style.setProperty('--preview-reading-width', previewWidth + '%');
            document.getElementById('preview-width-value').textContent = previewWidth + '%';
            localStorage.setItem('preview-reading-width-percent', previewWidth);
        }

        document.getElementById('preview-width-up').addEventListener('click', () => {
            applyPreviewWidth(previewWidth + WIDTH_STEP);
        });
        document.getElementById('preview-width-down').addEventListener('click', () => {
            applyPreviewWidth(previewWidth - WIDTH_STEP);
        });

        // Reading line-height controls
        const LINE_HEIGHT_MIN = 1.4;
        const LINE_HEIGHT_MAX = 2.4;
        const LINE_HEIGHT_STEP = 0.05;

        let previewLineHeight = parseFloat(localStorage.getItem('preview-line-height')) || 1.87;

        document.getElementById('preview-line-height-value').textContent = previewLineHeight.toFixed(2);

        function applyPreviewLineHeight(lineHeight) {
            previewLineHeight = Math.min(LINE_HEIGHT_MAX, Math.max(LINE_HEIGHT_MIN, lineHeight));
            previewLineHeight = Math.round(previewLineHeight * 100) / 100;
            document.getElementById('preview').style.setProperty('--preview-line-height', previewLineHeight);
            document.getElementById('preview-line-height-value').textContent = previewLineHeight.toFixed(2);
            localStorage.setItem('preview-line-height', previewLineHeight);
        }

        document.getElementById('preview-line-height-up').addEventListener('click', () => {
            applyPreviewLineHeight(previewLineHeight + LINE_HEIGHT_STEP);
        });
        document.getElementById('preview-line-height-down').addEventListener('click', () => {
            applyPreviewLineHeight(previewLineHeight - LINE_HEIGHT_STEP);
        });

        // Toast notification
        function showToast(message, { top = false } = {}) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast';
            if (top) toast.classList.add('toast-top');
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        // Markdown wrap helper
        function wrapSelection(before, after) {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const selected = editor.value.substring(start, end);
            const replacement = before + selected + after;
            editor.value = editor.value.substring(0, start) + replacement + editor.value.substring(end);
            if (selected) {
                editor.selectionStart = start;
                editor.selectionEnd = start + replacement.length;
            } else {
                editor.selectionStart = editor.selectionEnd = start + before.length;
            }
            updatePreview();
        }

        // Keyboard shortcuts
        editor.addEventListener('keydown', (e) => {
            const mod = e.metaKey || e.ctrlKey;

            if (e.key === 'Tab') {
                e.preventDefault();
                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                editor.value = editor.value.substring(0, start) + '    ' + editor.value.substring(end);
                editor.selectionStart = editor.selectionEnd = start + 4;
                updatePreview();
                return;
            }

            if (mod && e.key === 'b') { e.preventDefault(); wrapSelection('**', '**'); }
            if (mod && e.key === 'i') { e.preventDefault(); wrapSelection('*', '*'); }
            if (mod && e.key === 'k') { e.preventDefault(); wrapSelection('[', '](url)'); }
        });


        // Initial preview
        if (!savedContent) {
            editor.value = templates.all;
            updatePreview();
        }
    </script>
</body>
</html>
